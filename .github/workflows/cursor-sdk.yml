# Release binaries for the cursor-sdk fork branch only.
#
# Pushing feat/cursor-sdk-prime-integration builds the two host binaries this
# fork is meant to run: x86_64 Linux (Ubuntu 22.04 / GLIBC 2.35 baseline) and
# x86_64 Windows (static CRT). Artifacts are the same packaged shape as
# continuous.yml (tarball, checksums, manifest) and stay on the Actions run.
# This workflow does not tag, publish, or run on main.

name: cursor-sdk

on:
  push:
    branches:
      - feat/cursor-sdk-prime-integration
  workflow_dispatch:

permissions: {}

concurrency:
  group: cursor-sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-linux:
    name: build-x86_64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    # GLIBC 2.35 build baseline: artifacts built on the ubuntu-24.04 runner
    # image required GLIBC_2.39 and did not start on Ubuntu 22.04. The host
    # runner only supplies CPU; this container pins the build glibc.
    container:
      # Same digest-pinned Ubuntu 22.04 index release.yml uses. Google's
      # Docker Hub mirror avoids anonymous pull limits.
      image: mirror.gcr.io/library/ubuntu@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      TARGET: x86_64-unknown-linux-gnu
      COPYFILE_DISABLE: "1"
    steps:
      - name: Install build prerequisites (Ubuntu 22.04 container)
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates python3 git binutils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Trust the mounted checkout for packaging
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The pinned SHA is the toolchain pin: this action version has no
      # `toolchain` input, and its parse step hard-codes 1.98.1. Change the
      # compiler by changing the SHA; a `toolchain:` input is ignored.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x86_64-unknown-linux-gnu-glibc235-cursor-sdk
      - name: Build (release, locked)
        run: cargo build --release --locked --target "$TARGET" -j 4 -p pa-cli --bin prime-agent
      - name: Split the shipped binary + split-debug decoder
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/split_debug.py \
            --binary "target/${TARGET}/release/prime-agent" \
            --shipped "target/${TARGET}/dist/prime-agent" \
            --out "target/${TARGET}/dist" \
            --version "${version}" \
            --target "${TARGET}"
      - name: "GLIBC baseline gate: no symbols above GLIBC_2.35 (Ubuntu 22.04)"
        run: |
          set -euo pipefail
          bin="target/${TARGET}/dist/prime-agent"
          syms="$(objdump -T "${bin}" | grep -o 'GLIBC_[0-9.]*' || true)"
          if [ -z "${syms}" ]; then
            echo "::error::could not inspect ${bin} with objdump (no GLIBC symbols found)"
            exit 1
          fi
          max_glibc="$(printf '%s\n' "${syms}" | sort -Vu | tail -1)"
          echo "highest GLIBC symbol required: ${max_glibc}"
          top="$(printf '%s\nGLIBC_2.35\n' "${max_glibc}" | sort -Vu | tail -1)"
          if [ "${top}" != "GLIBC_2.35" ]; then
            echo "::error::binary requires ${max_glibc}, above the GLIBC_2.35 (Ubuntu 22.04) baseline"
            exit 1
          fi
      - name: Generate bundled catalog assets (fixture, offline-safe)
        run: |
          set -euo pipefail
          python3 scripts/release/bundle_catalog.py generate --fixture \
            --out "target/${TARGET}/catalog-assets"
      - name: Assemble tarball + checksums + manifest
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${version}" \
            --target "${TARGET}" \
            --sha "${GITHUB_SHA}" \
            --binary "target/${TARGET}/dist/prime-agent" \
            --decoder "target/${TARGET}/dist/prime-agent-${version}-linux-x64.debug.gz" \
            --catalog-assets "target/${TARGET}/catalog-assets" \
            --out-dir "target/${TARGET}/dist"
          cat "target/${TARGET}/dist/manifest.json"
      - name: Livecheck the assembled artifact
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/verify_release.py \
            --dist-dir "target/${TARGET}/dist" \
            --version "${version}" \
            --target "${TARGET}" \
            --sha "${GITHUB_SHA}"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-x86_64-unknown-linux-gnu
          path: |
            target/x86_64-unknown-linux-gnu/dist/prime-agent-*
            target/x86_64-unknown-linux-gnu/dist/SHA256SUMS
            target/x86_64-unknown-linux-gnu/dist/manifest.json
          if-no-files-found: error

  build-windows:
    name: build-x86_64-pc-windows-msvc
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The pinned SHA is the toolchain pin: this action version has no
      # `toolchain` input, and its parse step hard-codes 1.98.1. Change the
      # compiler by changing the SHA; a `toolchain:` input is ignored.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x86_64-pc-windows-msvc-crt-static-cursor-sdk
      - name: Resolve the Python interpreter
        shell: bash
        run: echo "PY=$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      # Static CRT: a dynamically linked build dies at process start on a
      # stock Windows box that has no vcruntime140.dll. The pin is this step
      # only, so dev builds stay dynamic.
      - name: Build (release, locked)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ env.TARGET }} -j 4 -p pa-cli --bin prime-agent
      - name: Generate bundled catalog assets (fixture, offline-safe)
        shell: bash
        run: |
          set -euo pipefail
          "${PY}" scripts/release/bundle_catalog.py generate --fixture \
            --out "target/${TARGET}/catalog-assets"
      - name: Assemble tarball + checksums + manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          "${PY}" scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${version}" \
            --target "${TARGET}" \
            --sha "${GITHUB_SHA}" \
            --binary "target/${TARGET}/release/prime-agent.exe" \
            --catalog-assets "target/${TARGET}/catalog-assets" \
            --out-dir "target/${TARGET}/dist"
          cat "target/${TARGET}/dist/manifest.json"
      - name: Livecheck the assembled artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          "${PY}" scripts/release/verify_release.py \
            --dist-dir "target/${TARGET}/dist" \
            --version "${version}" \
            --target "${TARGET}" \
            --sha "${GITHUB_SHA}"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-x86_64-pc-windows-msvc
          path: |
            target/x86_64-pc-windows-msvc/dist/prime-agent-*
            target/x86_64-pc-windows-msvc/dist/SHA256SUMS
            target/x86_64-pc-windows-msvc/dist/manifest.json
          if-no-files-found: error
